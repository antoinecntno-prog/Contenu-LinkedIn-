    <style>

    <script>
      (function () {
        "use strict";

        // ---------- Données : textes de contenu.json, plan de durées calculé par scripts/contenu.mjs
        const DONNEES = JSON.parse(document.getElementById("contenu").textContent);
        const TX = DONNEES.textes;
        const PLAN = DONNEES.plan;
        const DUREE = PLAN.duree;
        const S = {};
        const SD = {};
        PLAN.scenes.forEach((s) => {
          S[s.id] = s.debut;
          SD[s.id] = s.duree;
        });
        const FIN = (id) => S[id] + SD[id];

        // ---------- Constantes de charte
        const W = 1080;
        const H = 1920;
        const O = { x: 510, y: 960 }; // centre du carré texte, origine du zoom caméra
        const X0 = 110;
        const LARG = 800;
        const COUL = {
          encre: "#241E1B",
          bord: "#6E1A2C",
          vif: "#8E2740",
          ocre: "#C8862A",
          blanc: "#FFFFFF",
        };
        const POLICE = '"Schibsted Grotesk"';
        // Position de chaque scène dans le monde : la caméra passe de l'une à l'autre.
        const MONDE = {
          s1: [0, 0],
          s2: [1080, 0],
          s3: [1080, 1920],
          s4: [2160, 1920],
          s5: [2160, 3840],
          s6: [1080, 3840],
          s7: [0, 3840],
          s8: [0, 5760],
          s9: [1080, 5760],
        };
        const ORDRE = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9"];

        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const lerp = (a, b, p) => a + (b - a) * p;
        function hash3(a, b, c) {
          let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1442695041);
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          h ^= h >>> 16;
          return (h >>> 0) / 4294967296;
        }
        // Piste d'images clés : [[t, v], [t, v, "ease"], ...]. L'ease d'une clé règle le segment qui y arrive.
        function piste(cles) {
          const ks = cles.map((k) => ({ t: k[0], v: k[1], e: gsap.parseEase(k[2] || "none") }));
          return function (t) {
            if (t < ks[0].t) return ks[0].v;
            for (let i = 1; i < ks.length; i++) {
              if (t < ks[i].t) {
                const a = ks[i - 1];
                const b = ks[i];
                return a.v + (b.v - a.v) * b.e((t - a.t) / (b.t - a.t));
              }
            }
            return ks[ks.length - 1].v;
          };
        }

        Promise.all([
          document.fonts.load("900 100px " + POLICE),
          document.fonts.load("500 100px " + POLICE),
        ]).then(construire, construire);

        function construire() {
          const tl = gsap.timeline({ paused: true });
          const scenes = {};
          ORDRE.forEach((id) => {
            const el = document.getElementById(id);
            el.style.left = MONDE[id][0] + "px";
            el.style.top = MONDE[id][1] + "px";
            scenes[id] = el;
          });

          // ---------- Impacts : secousse caméra (8 px au plus) et pulsation de la mosaïque
          const IMPACTS = [];
          const impact = (t, a) => IMPACTS.push({ t, a });

          // ---------- Trous dans la mosaïque : le texte repose toujours sur l'encre
          const TROUS = [];
          function trou(id, x, y, w, h, t0, vague) {
            // Une zone ouverte en début de scène s'ouvre pendant le whip, sous le flou.
            if (t0 <= S[id] + 0.3 && id !== "s1") t0 = S[id] - 0.1;
            TROUS.push({
              x0: MONDE[id][0] + x - 16,
              y0: MONDE[id][1] + y - 12,
              x1: MONDE[id][0] + x + w + 16,
              y1: MONDE[id][1] + y + h + 12,
              t0,
              t1: FIN(id) + 0.4,
              v: vague || 0.1,
            });
          }

          // ---------- Mesure et coupe des lignes
          const mctx = document.createElement("canvas").getContext("2d");
          function largeur(str, poids, taille, approche) {
            mctx.font = poids + " " + taille + "px " + POLICE;
            mctx.letterSpacing = (approche || 0) * taille + "px";
            return mctx.measureText(str).width;
          }
          const PETITS = new Set([
            "de", "d’", "la", "le", "les", "l’", "un", "une", "et", "à", "en", "du", "des",
            "au", "aux", "sa", "ses", "son", "sur", "par", "ce", "on", "y", "ne",
          ]);
          function analyser(texte) {
            const mots = [];
            let cle = false;
            let cour = null;
            for (const ch of texte) {
              if (ch === "[") {
                cle = true;
                continue;
              }
              if (ch === "]") {
                cle = false;
                continue;
              }
              if (ch === " ") {
                if (cour) mots.push(cour);
                cour = null;
                continue;
              }
              if (!cour) cour = { segs: [] };
              const d = cour.segs[cour.segs.length - 1];
              if (d && d.k === cle) d.t += ch;
              else cour.segs.push({ t: ch, k: cle });
            }
            if (cour) mots.push(cour);
            mots.forEach((m) => (m.brut = m.segs.map((s) => s.t).join("")));
            return mots;
          }
          // Groupes insécables : petit mot + mot suivant, nombre + unité, mot + deux-points.
          function unites(mots) {
            const u = [];
            let g = [];
            mots.forEach((m, i) => {
              g.push(m);
              const suiv = mots[i + 1];
              const colle =
                suiv &&
                (PETITS.has(m.brut.toLowerCase()) || /^\d+$/.test(m.brut) || /^[:;!?»]$/.test(suiv.brut));
              if (!colle) {
                u.push(g);
                g = [];
              }
            });
            if (g.length) u.push(g);
            return u;
          }
          function couper(texte, poids, taille, approche, maxL) {
            const us = unites(analyser(texte));
            const chaine = (l) => l.map((g) => g.map((m) => m.brut).join(" ")).join(" ");
            const lw = (l) => largeur(chaine(l), poids, taille, approche);
            const glouton = (L) => {
              const lignes = [];
              let cour = [];
              for (const u of us) {
                const essai = cour.concat([u]);
                if (cour.length && lw(essai) > L) {
                  lignes.push(cour);
                  cour = [u];
                } else cour = essai;
              }
              if (cour.length) lignes.push(cour);
              return lignes;
            };
            let lignes = glouton(maxL);
            const nb = lignes.length;
            if (nb > 1) {
              let lo = maxL * 0.35;
              let hi = maxL;
              for (let k = 0; k < 20; k++) {
                const mid = (lo + hi) / 2;
                if (glouton(mid).length <= nb) hi = mid;
                else lo = mid;
              }
              lignes = glouton(hi);
            }
            return lignes.map((l) => ({ mots: l.flat(), largeur: lw(l) }));
          }
          // Bloc de texte positionné dans une scène. o : poids, taille, interligne, approche, x, y, maxL, heros
          function bloc(id, texte, o) {
            let taille = o.taille;
            let lignes;
            for (;;) {
              lignes = couper(texte, o.poids, taille, o.approche || 0, o.maxL);
              const ok = lignes.every((l) => l.largeur <= o.maxL + 0.5) && lignes.length <= (o.maxLignes || 4);
              if (ok || taille <= (o.tailleMin || 40)) break;
              taille -= 2;
            }
            const pas = Math.round(taille * o.interligne);
            const marge = Math.round(taille * 0.3);
            const el = document.createElement("div");
            el.className = "bloc" + (o.heros ? " heros" : "");
            el.dataset.texte = texte;
            el.dataset.carton = o.carton || texte;
            // Interlignage serré voulu sur les héros : les boîtes de ligne se touchent, les glyphes non.
            if (o.heros || o.serre) el.setAttribute("data-layout-allow-overlap", "");
            el.style.left = o.x + "px";
            el.style.top = o.y + "px";
            el.style.font = o.poids + " " + taille + "px " + POLICE;
            el.style.letterSpacing = (o.approche || 0) + "em";
            if (o.couleur) el.style.color = o.couleur;
            const lignesEl = [];
            lignes.forEach((l, i) => {
              const m = document.createElement("div");
              m.className = "masque";
              m.setAttribute("data-layout-allow-overflow", "");
              m.style.top = i * pas - marge + "px";
              m.style.height = pas + 2 * marge + "px";
              m.style.width = Math.ceil(l.largeur) + 48 + "px";
              if (o.heros) m.style.overflow = "visible";
              const ligne = document.createElement("div");
              ligne.className = "ligne";
              ligne.style.top = marge + "px";
              ligne.style.lineHeight = pas + "px";
              ligne.style.height = pas + "px";
              ligne.style.width = Math.ceil(l.largeur) + 4 + "px";
              l.mots.forEach((mot, j) => {
                if (j) ligne.appendChild(document.createTextNode(" "));
                mot.segs.forEach((sg) => {
                  const sp = document.createElement("span");
                  sp.textContent = sg.t;
                  if (o.heros || o.serre) sp.setAttribute("data-layout-allow-overlap", "");
                  if (sg.k) sp.className = "k";
                  ligne.appendChild(sp);
                });
              });
              m.appendChild(ligne);
              el.appendChild(m);
              lignesEl.push(ligne);
            });
            (o.parent || scenes[id]).appendChild(el);
            const w = Math.max(...lignes.map((l) => l.largeur));
            const largeurs = lignes.map((l) => l.largeur);
            el.style.width = Math.ceil(w) + "px";
            el.style.height = lignes.length * pas + "px";
            return { el, lignes: lignesEl, largeurs, h: lignes.length * pas, w, taille, pas, marge, x: o.x, y: o.y };
          }
          // Échelle maximale pour qu'une boîte agrandie autour de son origine reste dans le carré texte.
          const CARRE = { x0: 72, x1: 948, y0: 432, y1: 1488 };
          function echelleMax(x, y, w, h, ox, oy) {
            const ax = x + ox * w;
            const ay = y + oy * h;
            let s = 4;
            if (ax > x) s = Math.min(s, (ax - CARRE.x0) / (ax - x));
            if (x + w > ax) s = Math.min(s, (CARRE.x1 - ax) / (x + w - ax));
            if (ay > y) s = Math.min(s, (ay - CARRE.y0) / (ay - y));
            if (y + h > ay) s = Math.min(s, (CARRE.y1 - ay) / (y + h - ay));
            return Math.max(1, s);
          }
          // Claque bornée : un héros qui arrive en grand sans jamais sortir du carré texte.
          function claqueLigne(b, i, t, voulu, d, ease) {
            const ligne = b.lignes[i];
            ligne.style.transformOrigin = "0% 60%";
            const s = Math.min(voulu, echelleMax(b.x, b.y + i * b.pas, b.largeurs[i], b.pas, 0, 0.6) / 1.04);
            claque(ligne, t, { scale: s }, d, ease);
          }
          function claqueBloc(b, t, voulu, ox, oy, d, ease) {
            b.el.style.transformOrigin = ox * 100 + "% " + oy * 100 + "%";
            const s = Math.min(voulu, echelleMax(b.x, b.y, b.w, b.h, ox, oy) / 1.04);
            claque(b.el, t, { scale: s }, d, ease);
          }

          // ---------- Gestes d'animation
          // Révélation par masque, ligne à ligne (snappy).
          function revele(b, t, ecart, d) {
            b.lignes.forEach((l, i) => {
              tl.fromTo(
                l,
                { y: b.pas + b.marge },
                { y: 0, duration: d || 0.34, ease: "power4.out" },
                t + i * (ecart == null ? 0.08 : ecart),
              );
            });
          }
          // Apparition franche : opacité binaire (aucun fondu à l'entrée).
          function allume(el, t) {
            tl.fromTo(el, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01, ease: "steps(1)" }, t);
          }
          // Claque d'un texte héros (bouncy).
          function claque(el, t, de, d, ease) {
            allume(el, t);
            tl.fromTo(
              el,
              Object.assign({ scale: 1.8, x: 0, y: 0 }, de || {}),
              { scale: 1, x: 0, y: 0, duration: d || 0.42, ease: ease || "back.out(2.2)" },
              t,
            );
          }
          // Pulsation : montée éclair puis retour au repos. La première moitié part de l'état de repos,
          // donc un retour en arrière dans le temps retombe toujours sur le repos.
          function pouls(el, pic, t, d) {
            const repos = {};
            Object.keys(pic).forEach((k) => (repos[k] = /^scale/.test(k) ? 1 : 0));
            tl.fromTo(el, Object.assign({}, repos), Object.assign({}, pic, { duration: 0.04, ease: "none", immediateRender: false }), t);
            tl.fromTo(el, Object.assign({}, pic), Object.assign({}, repos, { duration: d || 0.3, ease: "power3.out", immediateRender: false }), t + 0.04);
          }
          // Déplacement rapide avec flou de mouvement directionnel (SVG), piloté par un proxy.
          let nFlou = 0;
          const defs = document.querySelector("#filtres defs");
          function filtre() {
            const id = "fm" + nFlou++;
            const f = document.createElementNS("http://www.w3.org/2000/svg", "filter");
            f.setAttribute("id", id);
            f.setAttribute("x", "-60%");
            f.setAttribute("y", "-60%");
            f.setAttribute("width", "220%");
            f.setAttribute("height", "220%");
            f.setAttribute("color-interpolation-filters", "sRGB");
            const g = document.createElementNS("http://www.w3.org/2000/svg", "feGaussianBlur");
            g.setAttribute("stdDeviation", "0 0");
            f.appendChild(g);
            defs.appendChild(f);
            return { id, noeud: g };
          }
          function mouvement(el, o) {
            const f = filtre();
            const ease = gsap.parseEase(o.ease || "power4.out");
            const de = Object.assign({ x: 0, y: 0, s: 1 }, o.de);
            const a = Object.assign({ x: 0, y: 0, s: 1 }, o.a);
            const etat = (p) => {
              const e = ease(clamp(p, 0, 1));
              return { x: lerp(de.x, a.x, e), y: lerp(de.y, a.y, e), s: lerp(de.s, a.s, e) };
            };
            const appliquer = (p) => {
              const e1 = etat(p);
              const depart = o.flouDepart && p <= 0;
              const e0 = depart ? etat(1 / 30 / o.d) : etat(p - 1 / 30 / o.d);
              el.style.transform = "translate(" + e1.x + "px," + e1.y + "px) scale(" + e1.s + ")";

          })();

          // ============ SCÈNE 8 : un rendez-vous par mois ============

          // ============ Flash blanc à l'entrée de la scène 7 ============

          // ============ Caméra ============
          const C = ORDRE.map((id) => MONDE[id]);
          const clesX = [[0, C[0][0]]];

          }
          const camX = piste(clesX);
          const camY = piste(clesY);
          const camS = piste([
            [0, 1.1],
            [0.7, 1.0, "expo.out"],
            [S.s2, 1.025, "sine.inOut"],
            [S.s2 + 0.3, 1.0, "power2.out"],
            [S.s3, 1.035, "sine.inOut"],
            [S.s3 + 0.3, 1.03, "power2.out"],
            [S.s4, 1.0, "sine.inOut"],
            [S.s4 + 0.3, 1.0, "power2.out"],
            [S.s5 - 0.1, 1.07, "sine.inOut"],
            [S.s5 + 0.3, 1.03, "power2.out"],
            [S.s6, 1.0, "sine.inOut"],
            [S.s6 + 0.3, 1.0, "power2.out"],
            [S.s7 - 0.001, 1.02, "sine.inOut"],
            [S.s7, 1.16],

            [S.s7 + 0.8, 1.0, "sine.inOut"],
            [S.s8, 1.03, "sine.inOut"],

            [S.s9, 1.03, "sine.inOut"],
            [S.s9 + 0.3, 1.03, "power2.out"],
            [S.s9 + 4, 1.0, "sine.inOut"],
          ]);
          const ampDerive = piste([
            [0, 1],
            [S.s9, 1],
            [S.s9 + 2.5, 0.35, "sine.inOut"],

          function derive(t) {
            const a = ampDerive(t);
            return {
              x: (7 * Math.sin(0.9 * t) + 4 * Math.sin(2.3 * t + 1)) * a,
              y: (6 * Math.sin(0.7 * t + 2) + 3 * Math.sin(1.9 * t)) * a,
            };

          function camera(t) {
            const d = derive(t);
            return { x: camX(t) + d.x, y: camY(t) + d.y, s: camS(t) };
          }
          function secousse(t) {
            let x = 0;

            IMPACTS.forEach((im, i) => {
              const u = t - im.t;
              if (u < 0 || u > 0.4) return;
              const e = im.a * Math.exp(-u / 0.09);
              x += e * Math.sin(2 * Math.PI * 17 * u + i);
              y += e * Math.cos(2 * Math.PI * 13 * u + 2 * i);
            });
            const n = Math.hypot(x, y);
            if (n > 8) {
              x *= 8 / n;
              y *= 8 / n;
            }
            return { x, y };
          }
          function pulsation(t) {
            let p = 0;
            IMPACTS.forEach((im) => {
              const u = t - im.t;
              if (u < 0 || u > 0.6) return;
              p += Math.min(1, im.a / 6) * Math.exp(-u / 0.14);
            });
            return Math.min(1, p);
          }

          // ============ Mosaïque (canvas, fonction pure du temps) ============
          const cv = document.getElementById("mosaique");
          const g = cv.getContext("2d");
          const PAS = 84;
          const TUILE = 72;
          const TENUE = DUREE - 2;
          const remplissage = piste([
            [0, 0.36],
            [S.s7 - 0.001, 0.36],
            [S.s7, 1],
            [S.s8 - 0.02, 1],
            [S.s8, 0.36],
            [S.s9, 0.36],
            [S.s9 + 3, 0.26, "sine.inOut"],
          ]);
          const probaTemps = (t) => (t >= TENUE ? 0 : t >= S.s9 ? 0.045 : 0.08);
          const probaContre = (t) => (t >= S.s9 ? 0 : 0.035);
          function deriveFond(t) {
            const T = S.s9;
            const v0 = { x: -24, y: -10 };
            const v1 = { x: -6, y: -2.5 };
            const tau = 1.2;
            if (t <= T) return { x: v0.x * t, y: v0.y * t };
            const u = t - T;
            const k = tau * (1 - Math.exp(-u / tau));
            return { x: v0.x * T + v1.x * u + (v0.x - v1.x) * k, y: v0.y * T + v1.y * u + (v0.y - v1.y) * k };
          }
          function versEcran(px_, py_, cam, sh) {
            return { x: O.x + cam.s * (px_ - cam.x - O.x) + sh.x, y: O.y + cam.s * (py_ - cam.y - O.y) + sh.y };
          }
          // Dix tuiles de la scène 7 : cellules choisies autour du héros, en coordonnées de fond.
          const ancres = [
            [150, 330], [520, 250], [900, 360], [980, 760], [930, 1560],
            [560, 1700], [170, 1620], [80, 1180], [700, 1480], [300, 1500],
            [860, 1130], [120, 820], [420, 1820], [1000, 1880], [40, 420], [760, 160],
          ];
          let cellules7 = null;
          function cellulesS7() {
            if (cellules7) return cellules7;
            const ta = S7.t0 + 0.6;
            const cam = camera(ta);
            const bs = 1 + (cam.s - 1) * 0.5;
            const bd = deriveFond(ta);
            const Bx = cam.x * 0.35 + bd.x;
            const By = cam.y * 0.35 + bd.y;
            cellules7 = ancres.slice(0, S7.nombre).map(([X, Y]) => {
              const qx = (X - O.x) / bs + Bx + O.x;
              const qy = (Y - O.y) / bs + By + O.y;
              return { i: Math.round(qx / PAS - 0.5), j: Math.round(qy / PAS - 0.5) };
            });
            return cellules7;
          }
          function dessinerMosaique(t, cam, sh) {
            g.fillStyle = COUL.encre;
            g.fillRect(0, 0, W, H);
            const bs = 1 + (cam.s - 1) * 0.5;
            const bd = deriveFond(t);
            const Bx = cam.x * 0.35 + bd.x;
            const By = cam.y * 0.35 + bd.y;
            const qx0 = (0 - O.x - sh.x) / bs + Bx + O.x;
            const qx1 = (W - O.x - sh.x) / bs + Bx + O.x;
            const qy0 = (0 - O.y - sh.y) / bs + By + O.y;
            const qy1 = (H - O.y - sh.y) / bs + By + O.y;
            const i0 = Math.floor(qx0 / PAS) - 1;
            const i1 = Math.ceil(qx1 / PAS) + 1;
            const j0 = Math.floor(qy0 / PAS) - 1;
            const j1 = Math.ceil(qy1 / PAS) + 1;
            const remp = remplissage(t);
            const b = Math.floor(t / 0.5 + 1e-6);
            const age = t - b * 0.5;
            const q = Math.floor(t / 0.25 + 1e-6);
            const ageQ = t - q * 0.25;
            const pb = b >= 1 ? probaTemps(t) : 0;
            const pq = q % 2 === 1 ? probaContre(t) : 0;
            const pul = pulsation(t);
            // Trous à l'écran
            const trous = [];
            TROUS.forEach((tr) => {
              if (t < tr.t0 - 0.05 || t > tr.t1) return;
              const a = versEcran(tr.x0, tr.y0, cam, sh);
              const c = versEcran(tr.x1, tr.y1, cam, sh);
              trous.push({ x0: a.x, y0: a.y, x1: c.x, y1: c.y, cx: (a.x + c.x) / 2, cy: (a.y + c.y) / 2, hw: (c.x - a.x) / 2, hh: (c.y - a.y) / 2, t0: tr.t0, v: tr.v });
            });
            const c7 = t >= S7.t0 + 0.5 && t < S7.t0 + 1.6 ? cellulesS7() : null;
            for (let i = i0; i <= i1; i++) {
              for (let j = j0; j <= j1; j++) {
                let visible = hash3(i, j, 11) < remp;
                let couleur = hash3(i, j, 23) < 0.3 ? COUL.vif : COUL.bord;
                let ech = 1;
                if (pb > 0 && age < 0.34 && hash3(i, j, b + 1000) < pb) {
                  visible = true;
                  couleur = COUL.vif;
                  ech *= 1 + 0.24 * Math.exp(-age / 0.1);
                }
                if (pq > 0 && ageQ < 0.2 && hash3(i, j, q + 5000) < pq) {
                  visible = true;
                  couleur = COUL.vif;
                  ech *= 1 + 0.16 * Math.exp(-ageQ / 0.08);
                }
                if (c7 && c7.some((c) => c.i === i && c.j === j)) continue;
                if (!visible) continue;
                ech *= 1 + 0.12 * pul;
                if (hash3(i, j, 31) < 0.45 * pul) couleur = COUL.vif;
                const X = O.x + bs * (i * PAS + PAS / 2 - Bx - O.x) + sh.x;
                const Y = O.y + bs * (j * PAS + PAS / 2 - By - O.y) + sh.y;
                // Une tuile qui touche une zone de texte s'efface en entier (aucune miette).
                let f = 1;
                const demi = (TUILE * bs * ech) / 2 + 10;
                for (const tr of trous) {
                  if (X + demi < tr.x0 || X - demi > tr.x1 || Y + demi < tr.y0 || Y - demi > tr.y1) continue;
                  const dc = Math.max(Math.abs(X - tr.cx) / Math.max(1, tr.hw), Math.abs(Y - tr.cy) / Math.max(1, tr.hh));
                  const ouv = clamp((t - tr.t0 - dc * tr.v) / 0.12, 0, 1);
                  f = Math.min(f, 1 - ouv);
                }
                if (f <= 0.02) continue;
                const cote = Math.round(TUILE * bs * ech * f);
                g.fillStyle = couleur;
                g.fillRect(Math.round(X - cote / 2), Math.round(Y - cote / 2), cote, cote);
              }
            }
            if (c7) dessinerDix(t, cam, sh, bs, Bx, By, c7);
          }
          // Les dix tuiles s'allument en ocre puis convergent vers le héros.
          function dessinerDix(t, cam, sh, bs, Bx, By, c7) {
            const t0 = S7.t0;
            const cible = versEcran(S7.cible.x, S7.cible.y, cam, sh);
            const conv = gsap.parseEase("power3.in");
            const posAt = (k, tt) => {
              const c = c7[k];
              const X = O.x + bs * (c.i * PAS + PAS / 2 - Bx - O.x) + sh.x;
              const Y = O.y + bs * (c.j * PAS + PAS / 2 - By - O.y) + sh.y;
              const p = clamp((tt - (t0 + 1.05 + k * 0.012)) / 0.45, 0, 1);
              const e = conv(p);
              return { x: lerp(X, cible.x, e), y: lerp(Y, cible.y, e), s: lerp(1, 0.55, e), p };
            };
            c7.forEach((c, k) => {
              const tk = t0 + 0.6 + k * 0.045;
              if (t < tk) {
                const P = posAt(k, t);
                const cote = TUILE * bs;
                g.fillStyle = hash3(c.i, c.j, 23) < 0.3 ? COUL.vif : COUL.bord;
                g.fillRect(P.x - cote / 2, P.y - cote / 2, cote, cote);
                return;
              }
              const P = posAt(k, t);
              if (P.p >= 1) return;
              const pop = 1 + 0.3 * Math.exp(-(t - tk) / 0.08);
              g.fillStyle = COUL.ocre;
              if (P.p > 0) {
                for (let s = 6; s >= 1; s--) {
                  const Q = posAt(k, t - (s * (1 / 30)) / 6);
                  g.globalAlpha = 0.16;
                  const cq = TUILE * bs * Q.s;
                  g.fillRect(Q.x - cq / 2, Q.y - cq / 2, cq, cq);
                }
                g.globalAlpha = 1;
              }
              const cote = TUILE * bs * P.s * (P.p > 0 ? 1 : pop);
              g.fillRect(P.x - cote / 2, P.y - cote / 2, cote, cote);
            });
          }

          // ============ Horloge (SVG dessiné en code) ============
          const NS = "http://www.w3.org/2000/svg";
          const horloge = document.getElementById("horloge");
          const svg = document.createElementNS(NS, "svg");
          svg.setAttribute("width", "420");
          svg.setAttribute("height", "420");
          svg.setAttribute("viewBox", "-210 -210 420 420");
          const el = (nom, attrs, parent) => {
            const e = document.createElementNS(NS, nom);
            Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v));
            (parent || svg).appendChild(e);
            return e;
          };
          el("circle", { cx: 0, cy: 0, r: 196, fill: COUL.encre, stroke: COUL.vif, "stroke-width": 18 });
          const graduations = [];
          for (let h = 0; h < 12; h++) {
            const quart = h % 3 === 0;
            graduations.push(
              el("rect", {
                x: quart ? -8 : -6,
                y: -174,
                width: quart ? 16 : 12,
                height: quart ? 48 : 30,
                fill: quart ? COUL.blanc : COUL.vif,
                transform: "rotate(" + h * 30 + ")",
              }),
            );
          }
          const fantomes = [];
          for (let k = 0; k < 7; k++) {
            fantomes.push(el("rect", { x: -9, y: -150, width: 18, height: 172, fill: COUL.ocre, opacity: 0.14 }));
          }
          const aiguille = el("rect", { x: -10, y: -152, width: 20, height: 176, fill: COUL.ocre });
          el("rect", { x: -18, y: -18, width: 36, height: 36, fill: COUL.ocre });
          horloge.appendChild(svg);
          const heure = (s) => {
            const n = parseInt(String(s).replace(/\D+/g, " ").trim().split(" ")[0], 10);
            return isNaN(n) ? 0 : n;
          };
          const hMatin = heure(TX.matin.heure) % 12;
          const hSoir = heure(TX.soir.heure) % 12;
          const aMatin = hMatin * 30;
          const delta = (((hSoir - hMatin) * 30) % 360 + 360) % 360 + 360;
          const angle = piste([
            [S.s2 + 6.05, 0],
            [S.s3 - 0.1, 0],
            [S.s3 + 0.5, aMatin, "back.out(1.15)"],
            [S.s6 + 0.5, aMatin],
            [S.s6 + 1.0, aMatin + delta, "back.out(0.6)"],
          ]);
          const DX = 1080;
          const clX = piste([
            [S.s2 + 6.05, 1450],
            [S.s2 + 6.5, 860, "back.out(1.6)"],
            [S.s3 - 0.12, 860],
            [S.s3 + 0.3, HORLOGE.x, "expo.inOut"],
            [S.s4 - 0.12, HORLOGE.x],
            [S.s4 + 0.12, HORLOGE.x - DX, "expo.inOut"],
            [S.s6 - 0.12, HORLOGE.x - DX],
            [S.s6 + 0.12, HORLOGE.x + 26, "expo.inOut"],
            [S.s6 + 0.45, HORLOGE.x, "power2.inOut"],
          ]);
          const clY = piste([
            [S.s2 + 6.05, 1680],
            [S.s3 - 0.12, 1680],
            [S.s3 + 0.3, HORLOGE.y, "expo.inOut"],
          ]);
          const clS = piste([
            [S.s2 + 6.05, 0.55],
            [S.s3 - 0.12, 0.55],
            [S.s3 + 0.3, HORLOGE.echelle, "back.out(1.4)"],
          ]);
          function dessinerHorloge(t, sh) {
            const vis = (t >= S.s2 + 6.05 && t < S.s4 + 0.2) || (t >= S.s6 - 0.15 && t < S.s7);
            horloge.style.visibility = vis ? "visible" : "hidden";
            if (!vis) return;
            horloge.style.transform =
              "translate(" + (clX(t) - 210 + sh.x) + "px," + (clY(t) - 210 + sh.y) + "px) scale(" + clS(t) + ")";
            const a = angle(t);
            aiguille.setAttribute("transform", "rotate(" + a + ")");
            const vitesse = Math.abs(a - angle(t - 1 / 30));
            fantomes.forEach((f, k) => {
              if (vitesse < 6) {
                f.setAttribute("opacity", "0");
                return;
              }
              f.setAttribute("opacity", "0.14");
              f.setAttribute("transform", "rotate(" + angle(t - ((k + 1) / 7) * (1 / 30)) + ")");
            });
            graduations.forEach((gr, h) => {
              const quart = h % 3 === 0;
              let c = quart ? COUL.blanc : COUL.vif;
              if (h === hMatin && t >= S.s3 + 0.5 && t < S.s6 + 0.5) c = COUL.ocre;
              if (h === hSoir && t >= S.s6 + 1.0) c = COUL.ocre;
              gr.setAttribute("fill", c);
            });
          }

          // ============ Rendu par image ============
          const monde = document.getElementById("monde");
          const cadre = document.getElementById("cadre");
          const flouCadre = document.getElementById("flou-cadre-noeud");
          function rendu(t) {
            const cam = camera(t);
            const sh = secousse(t);
            monde.style.transform =
              "translate(" + (O.x + sh.x) + "px," + (O.y + sh.y) + "px) scale(" + cam.s + ") translate(" +
              -(cam.x + O.x) + "px," + -(cam.y + O.y) + "px)";
            // Flou de mouvement des whip-pans, proportionnel à la vitesse de la caméra
            const av = camera(t - 1 / 30);
            const sx = Math.min(44, (Math.abs(cam.x - av.x) * cam.s) / 4.5);
            const sy = Math.min(44, (Math.abs(cam.y - av.y) * cam.s) / 4.5);
            if (sx + sy > 0.6 && Math.abs(cam.x - av.x) + Math.abs(cam.y - av.y) < 900) {
              flouCadre.setAttribute("stdDeviation", sx.toFixed(2) + " " + sy.toFixed(2));
              cadre.style.filter = "url(#flou-cadre)";
            } else cadre.style.filter = "none";
            dessinerMosaique(t, cam, sh);
            dessinerHorloge(t, sh);
          }
          const horlogeT = { t: 0 };
          tl.fromTo(
            horlogeT,
            { t: 0 },
            { t: DUREE, duration: DUREE, ease: "none", onUpdate: () => rendu(horlogeT.t) },
            0,
          );
          rendu(0);
          tl.seek(0);
          // Données lues par scripts/audit.mjs (aucun effet sur le rendu).
          window.__audit = {
            S,
            duree: DUREE,
            tenue: TENUE,
            impacts: IMPACTS.map((i) => i.t),
            temps: Array.from({ length: Math.floor(DUREE * 2) }, (_, b) => b * 0.5).filter((t) => t >= 0.5 && probaTemps(t) > 0),
          };
          window.__timelines["main"] = tl;
        }
      })();
    </script>
  </body>
