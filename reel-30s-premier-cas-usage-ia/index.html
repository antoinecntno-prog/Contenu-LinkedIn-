<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo-latin-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: normal;
      }
      :root {
        --ink: #241e1b;
        --bordeaux: #6e1a2c;
        --ocre: #c8862a;
        --white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #241e1b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
        font-family: "Archivo", sans-serif;
        color: var(--white);
      }
      .layer,
      .grp {
        position: absolute;
        inset: 0;
      }
      #bgB,
      #bgB2 {
        background: var(--bordeaux);
      }
      #bgW {
        background: var(--white);
        opacity: 0;
      }
      #ocreW {
        background: var(--ocre);
        clip-path: inset(0% 100% 100% 0%);
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 510px 905px;
        perspective: 1800px;
      }

      /* typographie : une famille, deux graisses, largeur variable animée */
      .card {
        position: absolute;
        left: 90px;
        font-weight: 800;
        white-space: nowrap;
      }
      .card .line {
        display: block;
        letter-spacing: -0.025em;
        opacity: 0;
      }
      .card .mask {
        display: block;
        overflow: hidden;
        padding: 0 40px 0 0;
      }
      .card .mask > .line {
        opacity: 1;
      }
      .line,
      .w,
      .kw,
      .ch {
        font-stretch: calc(var(--w, 85) * 1%);
      }
      .w,
      .kw,
      .ch {
        display: inline-block;
        position: relative;
      }
      .kw {
        opacity: 0;
        transform-origin: 0% 70%;
      }
      .ko {
        color: var(--ocre);
      }
      .echo {
        position: absolute;
        left: 0;
        top: 0;
        color: rgba(255, 255, 255, 0.06);
        -webkit-text-stroke: 3px var(--white);
        opacity: 0;
        pointer-events: none;
      }
      .glc {
        position: absolute;
        left: 90px;
        font-weight: 800;
        white-space: nowrap;
        opacity: 0;
      }
      .glc .line {
        display: block;
        letter-spacing: -0.025em;
      }
      .glc.g-ocre,
      .glc.g-ocre .ko {
        color: var(--ocre);
      }
      .glc.g-out,
      .glc.g-out .ko {
        color: rgba(255, 255, 255, 0.06);
        -webkit-text-stroke: 3px var(--white);
      }

      /* feuilles */
      .sheet {
        position: absolute;
        background: var(--white);
        box-shadow: 0 40px 80px rgba(36, 30, 27, 0.4);
      }
      .st {
        position: absolute;
        font-weight: 500;
        font-size: 44px;
        line-height: 48px;
        letter-spacing: -0.01em;
        font-stretch: 85%;
        color: var(--ink);
        white-space: nowrap;
      }
      .rl {
        position: absolute;
        background: var(--ink);
        transform-origin: 0 50%;
      }
      .pen {
        position: absolute;
        left: -60px;
        top: -260px;
        width: 200px;
        height: 280px;
        transform-origin: 60px 260px;
        opacity: 0;
      }
      #ul {
        position: absolute;
        background: var(--white);
        transform-origin: 0 50%;
      }

      /* décors */
      .speed {
        position: absolute;
        left: 0;
        background: var(--white);
        opacity: 0;
      }
      .bar {
        position: absolute;
        background: var(--ink);
        transform-origin: 50% 100%;
      }
      .hl {
        position: absolute;
        background: var(--ocre);
        transform-origin: 0 50%;
      }
      .qmark {
        position: absolute;
        overflow: visible;
      }
      .qmark path,
      .qmark rect {
        fill: none;
        stroke: rgba(255, 255, 255, 0.14);
        stroke-width: 6;
      }
      #ring {
        position: absolute;
        left: 260px;
        top: 830px;
        width: 500px;
        height: 500px;
      }
      #ring .track {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 6px solid rgba(255, 255, 255, 0.28);
      }
      #ring .sweep {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(rgba(255, 255, 255, 0.16) calc(var(--a, 0) * 1deg), rgba(255, 255, 255, 0) 0deg);
      }
      #ring .hand {
        position: absolute;
        left: 247px;
        top: 40px;
        width: 6px;
        height: 210px;
        background: var(--white);
        transform-origin: 50% 100%;
      }
      .dock {
        position: absolute;
        left: 90px;
        font-weight: 500;
        font-size: 44px;
        line-height: 52px;
        letter-spacing: -0.01em;
        font-stretch: 85%;
        color: var(--white);
        white-space: nowrap;
        opacity: 0;
      }
      .watch {
        position: absolute;
        width: 400px;
        height: 560px;
        opacity: 0;
      }
      .watch .wt {
        position: absolute;
        left: 0;
        top: 0;
        width: 400px;
        text-align: center;
        font-weight: 500;
        font-size: 44px;
        line-height: 48px;
        letter-spacing: -0.01em;
        font-stretch: 85%;
        white-space: nowrap;
      }
      .watch svg {
        position: absolute;
        left: 0;
        top: 70px;
        overflow: visible;
      }
      .ray {
        position: absolute;
        height: 8px;
        background: var(--white);
        transform-origin: 0 50%;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <filter id="mbOut" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur id="mbOutB" stdDeviation="0 0" /></filter>
          <filter id="mbIn" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur id="mbInB" stdDeviation="0 0" /></filter>
        </defs>
      </svg>

      <div id="bgB" class="layer"></div>
      <div id="bgW" class="layer"></div>

      <div id="cam">
        <div id="gC" class="grp"></div>
        <div id="gD" class="grp"></div>
        <div id="gE" class="grp"></div>
        <div id="gB" class="grp"></div>
        <div id="gA" class="grp"></div>
      </div>

      <div id="ocreW" class="layer"></div>
      <div id="bgB2" class="layer"></div>
      <div id="gF" class="grp"></div>
    </div>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const NNBSP = " "; // espace fine insécable avant « ? »

        // Générateur pseudo-aléatoire à graine : rendu identique à chaque image.
        let seed = 20260930;
        const rnd = () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };

        function build() {
          const tl = gsap.timeline({ paused: true });
          const K = (el, t, d, from, to, ease) =>
            tl.fromTo(el, from, Object.assign({}, to, { duration: d, ease: ease || "none", immediateRender: false }), t);
          const S = (el, t, props) => tl.set(el, props, t);
          const el = (tag, cls, parent, css) => {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (css) e.style.cssText = css;
            (parent || document.body).appendChild(e);
            return e;
          };

          /* ---------- constructeur de cartons ---------- */
          // [mot clé] passe en ocre ; la ponctuation qui suit arrive avec lui.
          function lineHTML(str, chars) {
            const split = (s) => (chars ? [...s].map((c) => (c === " " ? " " : `<span class="ch">${c}</span>`)).join("") : s);
            const parts = [];
            str.replace(/\[([^\]]+)\]([.,…]?)|([^\[]+)/g, (m, kw, punct, plain) => {
              if (kw) parts.push(`<span class="kw"><span class="ko">${split(kw)}</span>${split(punct || "")}</span>`);
              else
                parts.push(
                  plain
                    .split(/( )/)
                    .map((w) => (w === " " || w === "" ? w : `<span class="w">${split(w)}</span>`))
                    .join("")
                );
            });
            return parts.join("");
          }
          function card(parent, lines, o) {
            const c = el("div", "card", parent);
            c.style.top = o.top + "px";
            if (o.left !== undefined) c.style.left = o.left + "px";
            if (o.color) c.style.color = o.color;
            c.dataset.text = lines.map((l) => l.replace(/[\[\]]/g, "")).join(" ");
            const sizes = o.sizes || lines.map(() => o.size);
            lines.forEach((l, i) => {
              const lh = Math.round(sizes[i] * (o.lh || 1.05));
              const ln = document.createElement("div");
              ln.className = "line";
              ln.style.fontSize = sizes[i] + "px";
              ln.style.lineHeight = lh + "px";
              ln.innerHTML = lineHTML(l, o.chars);
              if (o.mask) {
                const m = el("div", "mask", c);
                m.style.height = lh + "px";
                m.appendChild(ln);
              } else c.appendChild(ln);
            });
            if (o.mask) gsap.set(c.querySelectorAll(".line"), { yPercent: 110, opacity: 0 });
            return {
              el: c,
              lines: [...c.querySelectorAll(".line")],
              words: [...c.querySelectorAll(".w")],
              kws: [...c.querySelectorAll(".kw")],
              chars: [...c.querySelectorAll(".ch")],
            };
          }
          // position d'un élément dans le repère de la page, sans transformations
          const pos = (e) => {
            let x = 0, y = 0;
            for (let n = e; n && n.id !== "root"; n = n.offsetParent) {
              x += n.offsetLeft;
              y += n.offsetTop;
            }
            return { x, y, w: e.offsetWidth, h: e.offsetHeight };
          };
          const kwPop = (kw, t, stretch) => {
            K(kw, t, 0.38, { scale: 0.75 }, { scale: 1 }, "back.out(1.7)");
            K(kw, t, 0.1, { opacity: 0 }, { opacity: 1 });
            if (stretch) K(kw, t, 0.5, { "--w": 125 }, { "--w": 85 }, "expo.out");
          };
          const exitUp = (c, t, opt) => {
            const o = opt || {};
            c.lines.forEach((ln, i) => {
              const s = t + i * (o.stagger || 0.03);
              K(ln, s, o.d || 0.3, { y: 0, "--w": 85 }, { y: o.y || -260, "--w": 62 }, "power3.in");
              K(ln, s, o.fade || 0.14, { opacity: 1 }, { opacity: 0 }, "power1.in");
            });
          };

          const gA = $("gA"), gB = $("gB"), gC = $("gC"), gD = $("gD"), gE = $("gE"), gF = $("gF");
          const cam = $("cam");

          /* =====================================================================
             A · 0 → 5,8 s · accroche sur bordeaux
             ===================================================================== */
          const b1 = card(gA, ["Votre", "premier", "projet [IA]"], { size: 200, top: 560, lh: 1.0 });
          b1.words.forEach((w) => {
            const e = el("span", "echo", w);
            e.textContent = w.textContent;
            e.setAttribute("data-layout-allow-overlap", "");
          });
          b1.lines.forEach((ln) => gsap.set(ln, { opacity: 1 }));
          gsap.set(b1.words, { opacity: 0 });
          const slams = [0, 0.11, 0.22];
          b1.words.forEach((w, i) => {
            const t = slams[i];
            if (i === 0) {
              // première image déjà composée : « Votre » est lisible dès t = 0
              gsap.set(w, { opacity: 1 });
              K(w, 0, 0.45, { y: 26, scale: 1.08, "--w": 100, opacity: 1 }, { y: 0, scale: 1, "--w": 85, opacity: 1 }, "expo.out");
            } else {
              K(w, t, 0.5, { y: 150, scale: 1.35, "--w": 125 }, { y: 0, scale: 1, "--w": 85 }, "expo.out");
              K(w, t, 0.1, { opacity: 0 }, { opacity: 1 });
            }
            const echo = w.querySelector(".echo");
            K(echo, t + 0.06, 0.5, { scale: 1, opacity: 0.55 }, { scale: 1.45, opacity: 0 }, "power2.out");
          });
          kwPop(b1.kws[0], 0.36, true);
          // traits de vitesse
          for (let i = 0; i < 12; i++) {
            const h = 3 + Math.round(rnd() * 4);
            const w = 220 + Math.round(rnd() * 380);
            const y = 280 + Math.round(rnd() * 1240);
            const s = el("div", "speed", gA, `top:${y}px;width:${w}px;height:${h}px;`);
            const t = slams[i % 3] + rnd() * 0.12;
            K(s, t, 0.34, { x: -w - 40, opacity: 0.45 }, { x: 1120, opacity: 0.45 }, "power2.in");
            S(s, t + 0.34, { opacity: 0 });
          }
          exitUp(b1, 2.1, { y: -900, stagger: 0.02, d: 0.3, fade: 0.08 });

          // « commence avec un stylo » + stylo blanc qui souligne
          const b2 = card(gA, ["commence avec", "un [stylo]"], { sizes: [120, 200], top: 640, lh: 1.02 });
          const t2 = 2.12;
          K(b2.lines[0], t2, 0.5, { x: 620, filter: "blur(22px)" }, { x: 0, filter: "blur(0px)" }, "expo.out");
          K(b2.lines[0], t2, 0.12, { opacity: 0 }, { opacity: 1 });
          K(b2.lines[1], t2 + 0.1, 0.45, { y: 130, scale: 1.2 }, { y: 0, scale: 1 }, "expo.out");
          K(b2.lines[1], t2 + 0.1, 0.1, { opacity: 0 }, { opacity: 1 });
          kwPop(b2.kws[0], t2 + 0.22, true);

          const stylo = pos(b2.kws[0]);
          const ulY = stylo.y + 186;
          const ul = el("div", "", gA);
          ul.id = "ul";
          const UL0 = { left: stylo.x, top: ulY, width: stylo.w, height: 12 };
          gsap.set(ul, Object.assign({ scaleX: 0 }, UL0));

          const penSVG = (body, detail) =>
            `<svg width="200" height="280" viewBox="-60 -260 200 280"><g transform="rotate(18)">` +
            `<g opacity="0.18" transform="translate(12 4)"><path d="M0 0 L-13 -62 L-13 -248 L13 -248 L13 -62 Z" fill="#241E1B"/></g>` +
            `<path d="M0 0 L-8 -26 L8 -26 Z" fill="${detail}"/>` +
            `<path d="M-8 -26 L8 -26 L13 -62 L-13 -62 Z" fill="${body}" stroke="${detail}" stroke-width="3" stroke-linejoin="round"/>` +
            `<rect x="-13" y="-232" width="26" height="170" fill="${body}"/>` +
            `<rect x="4" y="-220" width="4" height="140" fill="${detail}" opacity="0.3"/>` +
            `<rect x="-13" y="-248" width="26" height="16" fill="${detail}"/>` +
            `<rect x="-21" y="-232" width="6" height="72" fill="${body}" stroke="${detail}" stroke-width="2"/></g></svg>`;
          const penA = el("div", "pen", gA);
          penA.innerHTML = penSVG("#FFFFFF", "#241E1B");
          const pA0 = { x: 980, y: 1380, rotation: 30 };
          gsap.set(penA, pA0);
          K(penA, t2 + 0.25, 0.3, pA0, { x: stylo.x, y: ulY + 6, rotation: 0 }, "power3.out");
          K(penA, t2 + 0.25, 0.12, { opacity: 0 }, { opacity: 1 });
          K(penA, t2 + 0.55, 0.42, { x: stylo.x, y: ulY + 6 }, { x: stylo.x + stylo.w, y: ulY + 6 }, "power2.inOut");
          K(ul, t2 + 0.55, 0.42, { scaleX: 0 }, { scaleX: 1 }, "power2.inOut");
          K(penA, t2 + 1.02, 0.32, { x: stylo.x + stylo.w, y: ulY + 6, rotation: 0 }, { x: 1180, y: 420, rotation: -40 }, "power3.in");
          S(penA, t2 + 1.34, { opacity: 0 });
          exitUp(b2, 4.0, { y: -700, stagger: 0.02, fade: 0.1 });

          // le trait devient la feuille
          const SH_A = { left: 200, top: 300, width: 620, height: 820 };
          gsap.set(ul, { transformPerspective: 1600 });
          S(ul, 4.0, { transformOrigin: "50% 50%" });
          K(ul, 4.02, 0.6, Object.assign({}, UL0), Object.assign({}, SH_A), "expo.inOut");
          K(ul, 4.02, 0.9, { rotationY: -38, rotationX: 22, rotationZ: -6 }, { rotationY: 0, rotationX: 0, rotationZ: -2 }, "back.out(1.4)");
          S(ul, 4.02, { boxShadow: "0 40px 80px rgba(36,30,27,0.45)" });
          // « et une feuille. » lettre par lettre
          const b3 = card(gA, ["et une [feuille]."], { size: 120, top: 1240, chars: true });
          gsap.set(b3.lines[0], { opacity: 1 });
          const t3 = 4.02;
          const b3plain = b3.chars.filter((c) => !c.closest(".kw"));
          b3plain.forEach((ch, i) => {
            K(ch, t3 + i * 0.02, 0.4, { y: 90, rotation: 12 }, { y: 0, rotation: 0 }, "back.out(1.8)");
            K(ch, t3 + i * 0.02, 0.1, { opacity: 0 }, { opacity: 1 });
          });
          gsap.set(b3plain, { opacity: 0 });
          kwPop(b3.kws[0], t3 + b3plain.length * 0.02 + 0.06, true);
          // traversée : la feuille grandit jusqu'à remplir l'écran
          K(ul, 5.35, 0.45, { scale: 1, rotationZ: -2 }, { scale: 3.5, rotationZ: 0 }, "power3.in");
          K(b3.lines[0], 5.38, 0.22, { opacity: 1, y: 0 }, { opacity: 0, y: 60 }, "power2.in");
          S($("bgW"), 5.8, { opacity: 1 });
          S(gA, 5.8, { opacity: 0 });
          S($("bgB"), 5.8, { opacity: 0 });

          /* =====================================================================
             B · 5,8 → 7,45 s · « Deux semaines. » sur la page blanche
             ===================================================================== */
          const b4 = card(gB, ["Deux", "semaines."], { size: 180, top: 330, lh: 1.0, color: "#241E1B" });
          const t4 = 5.8;
          // surlignage ocre sous le texte, posé avant le carton dans l'ordre d'affichage
          b4.lines.forEach((ln, i) => {
            const w = ln.querySelector(".w");
            const p = pos(w);
            const hl = el("div", "hl", gB, `left:${p.x - 14}px;top:${p.y + 96}px;width:${p.w + 28}px;height:66px;`);
            gB.insertBefore(hl, b4.el);
            gsap.set(hl, { scaleX: 0 });
            K(hl, t4 + 0.16 + i * 0.08, 0.32, { scaleX: 0 }, { scaleX: 1 }, "power3.out");
            K(hl, 7.08, 0.18, { opacity: 1 }, { opacity: 0 });
          });
          b4.lines.forEach((ln, i) => {
            K(ln, t4 + i * 0.07, 0.45, { y: 70, scale: 1.25, "--w": 110 }, { y: 0, scale: 1, "--w": 85 }, "expo.out");
            K(ln, t4 + i * 0.07, 0.12, { opacity: 0 }, { opacity: 1 });
          });
          gsap.set(b4.lines, { transformOrigin: "0% 50%" });
          K(b4.el, 7.08, 0.2, { opacity: 1 }, { opacity: 0 });
          // quatorze traits groupés par sept, qui deviennent un calendrier de deux semaines
          const bars = [];
          for (let i = 0; i < 14; i++) {
            const x = 90 + i * 50 + (i >= 7 ? 70 : 0);
            const b = el("div", "bar", gB, `left:${x}px;top:1010px;width:16px;height:130px;`);
            gsap.set(b, { scaleY: 0 });
            K(b, t4 + 0.15 + i * 0.03, 0.35, { scaleY: 0 }, { scaleY: 1 }, "back.out(2)");
            const col = i % 7, row = Math.floor(i / 7);
            K(
              b,
              6.55 + i * 0.015,
              0.36,
              { left: x, top: 1010, width: 16, height: 130 },
              { left: 90 + col * 116, top: 960 + row * 116, width: 100, height: 100 },
              "back.out(1.3)"
            );
            bars.push(b);
          }
          // une case avale l'écran : retour sur l'encre
          const last = bars[13];
          K(last, 7.05, 0.4, { left: 90 + 6 * 116, top: 1076, width: 100, height: 100 }, { left: -20, top: -20, width: 1120, height: 1960 }, "expo.inOut");
          bars.slice(0, 13).forEach((b, i) => K(b, 7.05 + i * 0.01, 0.2, { opacity: 1 }, { opacity: 0 }));
          S($("bgW"), 7.45, { opacity: 0 });
          S(gB, 7.45, { opacity: 0 });

          /* =====================================================================
             C · 7,45 → 11,7 s · première semaine, la liste s'écrit
             ===================================================================== */
          const b5 = card(gC, ["[Première]", "[semaine]."], { size: 160, top: 250, lh: 1.0, chars: true });
          gsap.set(b5.lines, { opacity: 1 });
          gsap.set(b5.kws, { opacity: 1 });
          gsap.set(b5.chars, { opacity: 0 });
          const t5 = 7.45;
          b5.chars.forEach((ch, i) => {
            K(ch, t5 + i * 0.012, 0.42, { y: 110, "--w": 125, scaleY: 1.4 }, { y: 0, "--w": 85, scaleY: 1 }, "expo.out");
            K(ch, t5 + i * 0.012, 0.1, { opacity: 0 }, { opacity: 1 });
          });
          exitUp(b5, 8.98, { y: -400, stagger: 0.02, d: 0.28, fade: 0.1 });

          // feuille : 800 × 560, montée en 3D
          const shPos = el("div", "", gC, "position:absolute;left:110px;top:600px;width:800px;height:560px;");
          const sheet = el("div", "sheet", shPos, "left:0;top:0;width:800px;height:560px;");
          const hl2 = el("div", "hl", sheet, "left:20px;top:150px;width:760px;height:116px;");
          gsap.set(hl2, { scaleX: 0 });
          const rl = (x, y, w, h, op) => {
            const r = el("div", "rl", sheet, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${op || 1};`);
            return r;
          };
          const hRule = rl(24, 138, 752, 4);
          const vDiv = rl(498, 24, 3, 512);
          const r1 = rl(24, 276, 752, 3);
          const r2 = rl(24, 364, 752, 3);
          const r3 = rl(24, 440, 752, 3, 0.25);
          const r4 = rl(24, 516, 752, 3, 0.25);
